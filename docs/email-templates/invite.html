<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Convite — Doce Cuidado</title>
</head>
<body style="margin:0;padding:0;background-color:#FFF5EE;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#FFF5EE;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#FFFFFF;border-radius:18px;overflow:hidden;box-shadow:0 8px 32px rgba(44,62,80,0.08);">
          <tr>
            <td style="background:linear-gradient(135deg,#FDE8D0 0%,#FADBD8 100%);padding:36px 28px 28px;text-align:center;">
              <div style="font-size:52px;line-height:1;margin-bottom:8px;">&#128106;</div>
              <h1 style="margin:0;font-size:24px;font-weight:800;color:#2C3E50;">Doce Cuidado</h1>
              <p style="margin:8px 0 0;font-size:14px;color:#5D6D7E;">Você foi convidado(a)</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px;">
              <p style="margin:0 0 16px;font-size:16px;line-height:26px;color:#2C3E50;">Olá!</p>
              <p style="margin:0 0 16px;font-size:15px;line-height:24px;color:#2C3E50;">
                Você recebeu um convite para participar do <strong>Doce Cuidado</strong> — o companheiro digital para cuidar de crianças com diabetes.
              </p>
              <table role="presentation" cellspacing="0" cellpadding="0" style="margin:28px auto;">
                <tr>
                  <td style="border-radius:14px;background:#E74C3C;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 36px;font-size:16px;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:14px;">
                      Aceitar convite
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:20px 0 0;font-size:13px;line-height:20px;color:#95A5A6;">
                Se você não esperava este convite, pode ignorar este e-mail.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 28px;text-align:center;background:#FFFBF8;">
              <p style="margin:0;font-size:11px;color:#BDC3C7;">E-mail automático. Por favor, não responda.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
